# VyapaarIQ rule configuration. All legal/rate values are informational and
# must be verified before a demo. Values marked VERIFY are placeholders.

supplier:
  enterprise_class: small          # micro | small | medium (MSMED s.15/16 apply to micro & small)

msmed:
  max_terms_days: 45               # s.15: agreed period may not exceed 45 days from acceptance
  no_agreement_days: 15            # s.15: no written agreement -> 15 days from acceptance
  # MSMED s.2(b): with no written objection within 15 days of delivery, the day of
  # *actual delivery* is the day of deemed acceptance -> offset 0 (owner decision
  # 2026-11-23, was 15; see docs/references.md D-11). Result is always labelled
  # "deemed / estimated". VERIFY against the Act before real use.
  deemed_acceptance_offset_days: 0
  interest_multiplier: 3           # s.16: 3x bank rate, compounded monthly

rbi:
  # Bank Rate = MSF rate = repo + 25 bps. Repo raised to 5.50% on 2026-10-07 (secondary
  # sources; docs/references.md R-1). VERIFY on rbi.org.in before the demo.
  bank_rate_pct: 5.75
  as_of: "2026-10-07"

# Statute references printed in follow-up drafts (text only; never used in a calculation).
legal_refs:
  # Income-tax Act, 2025 (in force 2026-04-01) moved old s.43B(h) to s.37(2)(g).
  # VERIFY the numbering against the Act text (one source says 55(h)); references.md R-4.
  buyer_deduction_rule: "section 37(2)(g) of the Income-tax Act, 2025 (earlier section 43B(h) of the 1961 Act)"

tolerances:
  po_value_pct: 1.0                # C02: invoice taxable may exceed PO total by <= 1%
  gst_math_inr: 1.0                # C02: |taxable + GST - total| <= Rs 1
  line_qty_pct: 0.0                # C03: qty mismatch tolerance
  line_rate_pct: 0.5               # C03: rate mismatch tolerance
  line_blocker_pct: 10.0           # C03: deviation above this is a blocker, else warning
  party_fuzzy_ratio: 0.90          # C04: normalised name similarity threshold
  challan_after_invoice_days: 7    # C08: challan may trail invoice by <= N days

eway:
  threshold_inr: 50000             # C09: goods value above this needs an e-way bill

extraction:
  uncertain_below: 0.60            # field confidence below this makes dependent checks uncertain

scoring:
  penalties:
    blocker: 25
    warning: 10
    info: 0
    uncertain: 5
  overrides:
    C10: 30                        # acceptance missing is the killer case
  tiers:
    low_min: 85
    medium_min: 60

buyer_profile:
  min_history: 5
  reliable_max_median_late: 5      # days
  reliable_max_pct_over_30: 10     # %
  slow_min_median_late: 20         # days
  slow_min_pct_over_30: 40         # %

followups:
  steps: [-7, -1, 3, 10, 25]       # days relative to due date

actions:
  lead_days_before_due: 7
